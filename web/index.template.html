<!DOCTYPE html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>皮卡丘 · 电能冲刺 · 草原跑酷</title>
<style>
:root{color-scheme:light;font-family:system-ui,-apple-system,"PingFang SC",sans-serif;color:#244d3d;background:#f4f3e9}*{box-sizing:border-box}body{margin:0;padding:36px 24px;background:radial-gradient(ellipse at 15% 0%,#e0e9d5,transparent 50%),#f4f3e9;min-height:100vh}main{max-width:1080px;margin:auto}.eyebrow{font-size:11px;letter-spacing:3px;font-weight:750;color:#738574}header{display:flex;justify-content:space-between;align-items:center;margin:12px 0 22px}h1{margin:4px 0;font-size:32px;letter-spacing:-1px}header p{font-size:13px;color:#788479;margin:5px 0}.badge{font-size:12px;border:1px solid #cad4bd;border-radius:30px;padding:9px 15px}button{font:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:3px solid #d29443;outline-offset:4px}.game{border-radius:24px;overflow:hidden;position:relative;background:#dfebd6;box-shadow:0 20px 60px #294d3420;border:1px solid #d4dfc9}canvas{width:100%;display:block;aspect-ratio:4/3;touch-action:none}.hud{position:absolute;top:24px;left:27px;right:27px;display:flex;align-items:start;justify-content:space-between;pointer-events:none}.stats{display:flex;gap:28px}.stat small{display:block;font-size:10px;letter-spacing:2px;color:#688374}.stat strong{font-size:27px;font-variant-numeric:tabular-nums;line-height:1.5}.stat.secondary strong{font-size:21px}.controls{display:flex;gap:8px;pointer-events:auto}.icon{background:#ffffffa8;border:1px solid #fff8;border-radius:12px;min-width:41px;height:39px;color:#345c46;font-size:13px}.veil{position:absolute;inset:0;display:grid;place-items:center;background:#e8f0dd30;backdrop-filter:blur(3px)}.veil[hidden]{display:none}.card{text-align:center;padding:26px 38px 30px;border-radius:24px;background:#fafbf1ed;border:1px solid #ffffff;box-shadow:0 16px 60px #335a3820;max-width:90%}.acorn{font-size:34px}.card h2{font-size:36px;letter-spacing:-1px;margin:8px 0}.card p{color:#70806d;font-size:14px;line-height:1.8;margin:10px 0 21px}.primary{border:0;border-radius:13px;background:#2e6148;color:#fff;padding:13px 34px;font-weight:650;box-shadow:0 5px 0 #1b4430}.primary:hover{background:#3b7456}.card .hint{font-size:11px;color:#8c9882;margin:18px 0 0}.under{display:flex;justify-content:space-between;align-items:center;gap:15px;margin:20px 3px}.instructions{font-size:12px;color:#71816d;line-height:2}kbd{font:inherit;border:1px solid #cdd6c0;border-bottom-width:3px;border-radius:5px;padding:2px 6px;background:#fafbf2;color:#4c664f;margin:0 2px}.jump:disabled{opacity:.45;cursor:default}.jump{background:#e3ead8;border:1px solid #c9d6bf;color:#315940;border-radius:12px;padding:11px 27px;white-space:nowrap}.foot{font-size:11px;color:#95a18e;margin-top:26px;display:flex;justify-content:space-between}.status{font-size:12px;color:#8b9b83}.newbest{color:#b37c29}@media(max-width:600px){body{padding:24px 12px}h1{font-size:26px}.badge{display:none}.game{border-radius:16px}.hud{top:10px;left:13px;right:12px}.stats{gap:14px}.stat strong{font-size:21px}.stat.secondary strong{font-size:17px}.stat small{font-size:8px;letter-spacing:1px}.icon{height:31px;min-width:32px;font-size:11px}.card{padding:14px 23px}.card h2{font-size:25px;margin:3px}.card p{font-size:11px;margin:6px 0 12px}.acorn{display:none}.card .hint{margin-top:12px;font-size:9px}.primary{padding:9px 25px}.under{align-items:start;flex-wrap:wrap}.foot{font-size:9px}.status{display:none}}
</style>
<main><div class="eyebrow">ELECTRIC MEADOW / 电光草原</div><header><div><h1>皮卡丘 · 电能冲刺<span style="color:#b28e55">.</span></h1><p>穿过晴空下的草原，用电光一闪冲向远方。</p></div><span class="badge">⚡ 皮卡丘草原冒险</span></header>
<section class="game" aria-label="皮卡丘跑酷游戏"><canvas id="game" width="960" height="720" tabindex="0" aria-label="按空格或上方向键跳跃，P 暂停，R 重来"></canvas><div class="hud"><div class="stats"><div class="stat"><small>分数</small><strong id="score">0000</strong></div><div class="stat secondary"><small>电能</small><strong id="nuts">0</strong></div><div class="stat secondary"><small>最高分</small><strong id="best">0</strong></div></div><div class="controls"><button class="icon" id="sound" aria-label="开启声音" title="声音">静音</button><button class="icon" id="pause" aria-label="暂停游戏" title="暂停 / P">Ⅱ</button></div></div><div class="veil" id="overlay"><div class="card"><div class="acorn">⚡</div><h2 id="title">皮卡丘，出发！</h2><p id="message">二段跳越过精灵球，冲刺穿过危险。<br>靠近电能球自动吸取，跑出新的纪录。</p><button class="primary" id="start">开始奔跑 →</button><p class="hint" id="hint">空格二段跳 · X 电光一闪 · 靠近吸电能球</p></div></div></section>
<div class="under"><div class="instructions"><kbd>空格</kbd> / <kbd>↑</kbd> 二段跳　<kbd>X</kbd> 冲刺　<kbd>P</kbd> 暂停　<kbd>R</kbd> 重来<br>也可以点击画面或右侧按钮跳跃。</div><span class="status" id="status">每颗电能球 +10 分 · 速度逐渐提升</span><div style="display:flex;gap:8px"><button class="jump" id="dash" disabled>电光一闪 X</button><button class="jump" id="jump">跳跃 ↑</button></div></div><div class="foot"><span>PIKACHU RUNNER — v6 同步试玩版</span><span>无需联网 · 二段跳 · 冲刺 0.4 秒 / 冷却 4 秒 · 电能球磁吸</span></div></main>
<script>

'use strict';
const ASSETS=__ASSETS__,$=id=>document.getElementById(id),canvas=$('game'),ctx=canvas.getContext('2d'),images={};
let ready=false,mode='ready',last=0,acc=0,ticks=0,score=0,nuts=0,best=0,speed=4,y=-78,vy=0,jumpsLeft=2,dashTicks=0,dashCooldown=0,ballGap=60,energyGap=35,farOffset=0,trackOffset=0,muted=true,audio=null;
const obstacles=Array.from({length:3},()=>({active:false,x:900,visible:false,age:0})),pickups=Array.from({length:4},()=>({active:false,x:900,y:-26,visible:false,age:0}));
try{best=Number(localStorage.getItem('pikachu-electric-best'))||0;}catch{}
const rand=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
function hud(){ $('score').textContent=String(score).padStart(4,'0');$('nuts').textContent=nuts;$('best').textContent=best;$('dash').disabled=mode!=='running'||dashCooldown>0;$('dash').textContent=dashCooldown>0?'闪电 '+Math.ceil(dashCooldown/60)+'s':'电光一闪 X';$('status').textContent='剩余跳跃 '+jumpsLeft+' · 电能自动吸取';}
function panel(title,message,button){$('title').textContent=title;$('message').innerHTML=message;$('start').textContent=button;$('overlay').hidden=false;}
function tone(freq){if(muted)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();audio.resume();const o=audio.createOscillator(),v=audio.createGain();o.frequency.value=freq;v.gain.setValueAtTime(.035,audio.currentTime);v.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.12);o.connect(v);v.connect(audio.destination);o.start();o.stop(audio.currentTime+.12);}catch{}}
function reset(){if(!ready)return;mode='running';last=acc=ticks=score=nuts=0;speed=4;y=-78;vy=0;jumpsLeft=2;dashTicks=dashCooldown=0;ballGap=60;energyGap=35;farOffset=trackOffset=0;for(const o of obstacles)Object.assign(o,{active:false,x:900,visible:false,age:0});for(const n of pickups)Object.assign(n,{active:false,x:900,y:-26,visible:false,age:0});$('overlay').hidden=true;$('pause').textContent='Ⅱ';hud();canvas.focus({preventScroll:true});}
function action(){if(!ready)return;if(mode==='ready'||mode==='over'){reset();return;}if(mode!=='running')return;if(jumpsLeft>0){vy=11.5;jumpsLeft--;tone(460);hud();}}
function dash(){if(mode!=='running'||dashCooldown>0)return;dashTicks=24;dashCooldown=240;tone(750);hud();}
function pause(){if(mode==='running'){mode='paused';panel('休息一下，补充电力','准备好后继续草原冒险。','继续奔跑 →');$('pause').textContent='▶';}else if(mode==='paused'){mode='running';last=0;$('overlay').hidden=true;$('pause').textContent='Ⅱ';}hud();}
function end(){mode='over';dashTicks=0;let record=score>best;if(record){best=score;try{localStorage.setItem('pikachu-electric-best',best);}catch{}}hud();tone(150);panel(record?'新的草原纪录！':'下次再跑远一点',`本次得分 <b>${score}</b> · 收集电能 <b>${nuts}</b><br>按 X 发动电光一闪，可以穿过精灵球。`,'再跑一次 →');}
function step(){ticks++;score=Math.floor(ticks/6)+nuts*10;speed=Math.min(7,4+ticks/1800);if(dashCooldown>0)dashCooldown--;if(dashTicks>0){dashTicks--;speed*=1.65;}vy-=.6;y+=vy;if(y< -78){y=-78;vy=0;jumpsLeft=2;}farOffset=(farOffset+speed*.22)%480;trackOffset=(trackOffset+speed)%480;
ballGap-=speed;energyGap-=speed;
if(ballGap<=0){const o=obstacles.find(o=>!o.active);if(o)Object.assign(o,{active:true,visible:false,age:0,x:rand(290,335)});ballGap=rand(300,540);}
if(energyGap<=0){const n=pickups.find(n=>!n.active);if(n)Object.assign(n,{active:true,visible:false,age:0,x:rand(290,340),y:rand(-45,-14)});energyGap=rand(175,300);}
for(const o of obstacles){if(!o.active)continue;o.x-=speed;o.age++;o.visible=o.age>=3;if(o.x< -285){o.active=o.visible=false;o.x=900;}else if(dashTicks===0&&o.x> -174&&o.x< -106&&y< -49){end();return;}}
for(const n of pickups){if(!n.active)continue;n.x-=speed;n.age++;n.visible=n.age>=3;if(n.x< -285){n.active=n.visible=false;n.x=900;continue;}if(n.x> -250&&n.x< -30&&n.y>y-100&&n.y<y+100){n.x+=(-140-n.x)*.2;n.y+=(y-n.y)*.2;}if(n.x> -175&&n.x< -105&&y>n.y-30&&y<n.y+30){nuts++;n.active=n.visible=false;n.x=900;tone(950);}}
if(ticks%6===0)hud();}
function draw(){ctx.setTransform(2,0,0,2,0,0);ctx.clearRect(0,0,480,360);if(!ready)return;ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';ctx.drawImage(images.sky,0,0,480,360);ctx.drawImage(images.far,-farOffset,0,960,360);ctx.drawImage(images.track,-trackOffset,0,960,360);
for(const o of obstacles)if(o.active&&o.visible)ctx.drawImage(images.ball,240+o.x-21,244,42,44);
for(const n of pickups)if(n.active&&n.visible)ctx.drawImage(images.orb,240+n.x-12,180-n.y-15,24,30);
if(mode==='running'&&dashTicks>0)ctx.drawImage(images['glow'+(Math.floor(ticks/3)%2)],-20,135-y,164,90);
const frame=mode==='running'&&y<=-78?Math.floor(ticks/5)%6:0;ctx.drawImage(images['run'+frame],60,147-y,80,66);}
function frame(time){const dt=last?Math.min(.05,(time-last)/1000):0;last=time;if(mode==='running'){acc+=dt;while(acc>=1/60&&mode==='running'){step();acc-=1/60;}}else acc=0;draw();requestAnimationFrame(frame);}
$('start').onclick=()=>mode==='paused'?pause():reset();$('jump').onclick=action;$('dash').onclick=dash;$('pause').onclick=pause;$('sound').onclick=()=>{muted=!muted;$('sound').textContent=muted?'静音':'有声';if(!muted)tone(650);};
canvas.addEventListener('pointerdown',e=>{e.preventDefault();action();});window.addEventListener('keydown',e=>{if(e.code==='Space'&&document.activeElement?.tagName==='BUTTON')return;if(['Space','ArrowUp','KeyX','KeyR','KeyP'].includes(e.code)){e.preventDefault();if(e.repeat)return;if(e.code==='KeyX')dash();else if(e.code==='KeyR')reset();else if(e.code==='KeyP')pause();else action();}});document.addEventListener('visibilitychange',()=>{if(document.hidden&&mode==='running')pause();});
Promise.all(Object.entries(ASSETS).map(([name,src])=>new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>{images[name]=im;resolve();};im.onerror=reject;im.src=src;}))).then(()=>{ready=true;hud();draw();}).catch(()=>panel('素材加载失败','请重新打开此 HTML 文件。','重试'));requestAnimationFrame(frame);

</script></html>
